# Alembic config for Neptune's THREE independent databases (portfolio/securities/macro —
# see src/neptune/db/base.py). They share no tables, so each gets its own fully independent
# migration history via a named section below, invoked with `-n <name>`:
#
#   alembic -n portfolio   revision --autogenerate -m "..."
#   alembic -n securities  upgrade head
#   alembic -n macro       upgrade head
#
# No `sqlalchemy.url` is set anywhere in this file — each database's env.py resolves its own
# connection URL from neptune.config.settings at runtime (the app's own env/.env/fallback
# resolution), never a static credential committed here.

[DEFAULT]
prepend_sys_path = .
path_separator = os

[alembic]
# Base section Alembic requires even though every real invocation uses -n <name> below.
# Points at portfolio so a bare `alembic ...` (no -n) still does something coherent rather
# than erroring in a confusing way — don't rely on this section directly.
script_location = %(here)s/alembic/portfolio

[portfolio]
script_location = %(here)s/alembic/portfolio

[securities]
script_location = %(here)s/alembic/securities

[macro]
script_location = %(here)s/alembic/macro

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts. See the Alembic docs for details.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
