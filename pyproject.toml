[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neptune"
version = "0.1.0"
description = "Iridium Capital Management — quantitative risk intelligence platform"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "cvxpy>=1.4",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1", "alembic>=1.13"]
dev = ["pytest>=8.0", "httpx>=0.27", "alembic>=1.13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
